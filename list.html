<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/main.css">
    <title>Students</title>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
        }
    </style>
</head>
<body class="bg-[#E5E5E5]">
    
    <div class="flex">
        <nav class="w-[22%] h-[100vh] overflow-y-auto bg-[#F2EAE1]">
            <div class="p-[35px] mb-[54px]">
                <img src="./images/Logo.svg" alt="logo" width="171" height="24">
                <a href="#" class="block flex items-center flex-col mt-[54px]">
                    <label class="block cursor-pointer">
                        <input class="choose-profile-img hidden" type="file" accept="image/*" onchange="handleProfileImageChange()">
                        <img class="profileImage" src="./images/profile-icon.svg" alt="profile icon" width="130" height="100">
                    </label>                      
                    <strong class="user-name text-[17px] leading-[20px] font-bold my-3">Karthi Madesh</strong>
                    <span class="text-[14px] leading-[17px] text-[#FEAF00]">Admin</span>
                </a>
                <button onclick="handleStudenttBtnClick()" class="hover:scale-[1.3] duration-300 w-[199px] mx-auto mt-[63px] flex items-center justify-center gap-[15px] py-[14px] bg-[#FEAF00] text-black text-[14px] leading-[17px] font-medium text-center font-medium rounded-[4px]">
                    <img src="./images/graduation-cap 1.svg" alt="cap img" width="20" height="16">
                    Students</button>
                </div>
                <button onclick="handleLogoutBtn()" class="hover:scale-[1.3] duration-300 block flex items-center gap-3 mx-auto mt-[200px]">
                    <span class="text-[14px] leading-[17px] font-medium">Logout</span>
                    <img src="./images/logout-icon.svg" alt="logout icon" width="17" height="17">
                </button>
            </nav>
            <div class="w-[78%] h-[100vh] overflow-y-auto">
                <div class="flex items-center justify-end gap-[31px] px-[61px] py-[31.5px] bg-[#F2EAE1] px-[30px]">
                    <input class="search-input py-[14px] text-[23px] leading-[23px] outline-none border-r-[1px] inline-block pl-[34px] pr-[24px] bg-white rounded-[8px]" type="text" placeholder="Search" name="searchValue" autocomplete="off">
                    <button class="hover:scale-[1.3] duration-300">
                        <img class="block" src="./images/bell.svg" alt="bell" width="17" height="20">
                    </button>
                </div>
                <div class="flex items-center justify-between pt-[22px] px-[42px] pb-[11px] bg-[#E5E5E5] border-b-[2px] border-[#ACACAC]">
                    <h1 class="text-[22px] leading-[26px] font-bold">Students List</h1>
                    <button onclick="handleAddStudentBtnClick()" class="hover:scale-[1.3] duration-300 w-[199px] inline-block py-[14px] bg-[#FEAF00] text-white text-[14px] text-center font-medium rounded-[4px]">ADD NEW STUDENT</button>
                </div>
                <div class="px-[42px] bg-[#E5E5E5]">
                    <table class="w-full">
                        <thead>
                            <tr class="bg-[#E5E5E5] text-center">
                                <th class="text-[#ACACAC] py-[17px] text-[16px] font-bold">Name</th>
                                <th class="text-[#ACACAC] py-[17px] text-[16px] font-bold">Email</th>
                                <th class="text-[#ACACAC] py-[17px] text-[16px] font-bold">Enroll Number</th>
                                <th class="text-[#ACACAC] py-[17px] text-[16px] font-bold">Date</th>
                                <th class="text-[#ACACAC] py-[17px] text-[16px] font-bold">Actions</th>
                            </tr>
                            <thead>                                                  
                                <tbody class="student-tbody">
                                    
                                </tbody>
                            </table>
                        </div>            
                    </div>
                </div>

                <!-- for add part -->
                <div class="modal-wrapper fixed scale-0 top-0 bottom-0 right-0 left-0 backdrop-blur duration-300" id="wrapper">
                    <div class="modal-inner w-[1000px] h-[700px] bg-[#FEAF00] absolute top-0 bottom-0 right-0 left-0 m-auto rounded-md">
                        
                    </div>
                </div>
                
                
                <!-- student modal  -->
                <div class="more-wrapper fixed scale-0 top-0 bottom-0 right-0 left-0 backdrop-blur duration-300" id="studentModal">
                    <div class="modal-inner w-[600px] h-[400px] bg-white absolute top-0 bottom-0 right-0 left-0 m-auto rounded-md">
                        <div class="p-6 flex items-center justify-between">
                            <img id="studentImg" src="./images/profile-icon.svg" alt="img" width="109" height="116">
                            <div>
                                <h2 class="text-xl font-bold" id="studentName">Student Name</h2>
                                <p id="studentEmail">Email: fnx@.com</p>
                                <p id="studentPhone">Phone: +99897xxxxxxx</p>
                                <p id="studentEnroll">Enroll Number: 123456</p>
                                <p id="studentDate">Date: 2007-09-14</p>
                            </div>
                        </div>
                        <button onclick="closeModal()" class="mt-4 px-4 py-2 bg-red-500 text-white block mx-auto w-[250px] rounded-md hover:scale-[1.3] duration-300">Close</button>
                    </div>
                </div>                
                
                
                
                <script src="./js/list.js"></script>
                <script src="https://cdn.tailwindcss.com"></script>
                <script>
                    tailwind.config = {
                        theme: {
                            extend: {
                                colors: {
                                    clifford: '#da373d',
                                }
                            }
                        }
                    }
                </script>
            </body>
            </html>
