<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Student</title>
    <link rel="stylesheet" href="./css/main.css">
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
        }
    </style>
</head>
<body class="signup-body">
    <form class="signup-form w-[475px] h-[550px] absolute top-0 bottom-0 right-0 left-0 rounded-[20px] mt-11 mb-[85px] px-[30px] m-auto bg-white">
        <a class="inline-block mx-auto mt-[44px] mb-11" href="/">
            <img src="./images/Logo.svg" alt="logo icon" width="285" height="39">
        </a>
        <div class="flex flex-col items-center mb-[50px] text-center">
            <h2 class="font-bold text-[22px] leading-[26px] mb-[9px]">Sign up</h2>
            <p class="text-[14px] leading-[17px]">Enter your credentials to access your account</p>
        </div>
        <strong class="block text-[14px] leading-[17px] font-[500] text-[#6C6C6C] mb-[10px]">Enter new login</strong>
        <input class="w-[415px] mb-[20px] pl- focus:outline-none focus:border-black py-3 rounded-[4px] border-[1px] border-[#E5E5E5] py-[15px] pl-[15px]" type="text" name="newusername" placeholder="Enter your login" required autocomplete="off">
        <strong class="block text-[14px] leading-[17px] font-[500] text-[#6C6C6C] mb-[10px]">Create new password</strong>
        <input class="w-[415px] mb-[30px] focus:outline-none focus:border-black py-3 rounded-[4px] border-[1px] border-[#E5E5E5] pl-[15px]" type="password" name="userpassword" placeholder="Enter your password" required autocomplete="off">
        <button class="w-[100%] inline-block py-[14px] bg-[#FEAF00] text-white text-[14px] text-center font-bold rounded-[4px] leading-[17px]" type="submit">
            SIGN UP
        </button>
    </form>
    
    <script src="./js/signup.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        clifford: '#da373d',
                    }
                }
            }
        }
    </script>
</body>
</html>
